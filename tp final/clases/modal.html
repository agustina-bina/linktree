<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;

        }
        .modalsub{
            position: absolute;
            background-color: blueviolet;
            width: 100%;
            height: 100%;
            top: 0%;
            left: 0%;
            display: block;

        }

        .hidden {
            display: none;
        }



    </style>
</head>
<body>
    <form action="" id="suscriptionFrom">
        <label for="email">Ingresa email: </label>
        <input type="email" id="email">
        <button type="submit"> mandale formulario </button>

    </form>
    <script >

        function cerrarmodal() {
            const modal = document.querySelector('.modalsub');
            modal.classList.toggle('hidden');

        }


        document.getElementById('suscriptionFrom').addEventListener('submit', function(e){
            e.preventdefault(); <!-- no redirecciona-->
            const modalsub = document.createElement('div')
            modalsub.innerHTML = `<h1> hola mundo </h1>
            <button onclick="cerrarmodal"> cerrar </button>`
            modalsub.classList.add('modalsub')
            document.body.append(modalsub)
            



        })

    </script>
</body>
</html>
